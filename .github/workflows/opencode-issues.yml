name: opencode-issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verificar antigüedad de cuenta (anti-spam)
        id: check
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;

      - name: Checkout repository
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generar triaje con opencode
        if: steps.check.outputs.result == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.2
          use_github_token: true
          prompt: |
            Se abrió un issue en este repositorio (clon de Asteroids en HTML5
            Canvas + JS vanilla; la lógica está en game.js con clases Ship,
            Asteroid, Bullet, Particle; consulta README.md y AGENTS.md si
            necesitas contexto).

            Tu ÚNICA tarea es analizar el issue y escribir DOS archivos en /tmp.
            NO edites el issue, NO comentes en GitHub, NO crees ramas, commits
            ni PRs. Solo escribe archivos en /tmp.

            1. Escribe /tmp/triage_block.md (usa el tool de bash con un heredoc
               'BLOCK') con este contenido en español, rellenando los campos
               según el issue real:

               <!-- opencode-triage:start -->
               ## Triaje automático (opencode)

               - **Tipo:** bug | mejora | pregunta | documentación
               - **Severidad estimada:** baja | media | alta | crítica
               - **Área del código:** archivo/clase/función (ej. game.js · Ship.thrust) o "no aplica"
               - **Resumen:** 1-2 oraciones del problema o solicitud
               - **Pasos sugeridos para investigar:** lista numerada
               - **Posible causa o archivos a revisar:** lista
               <!-- opencode-triage:end -->

            2. Escribe /tmp/labels.txt con 1 a 3 etiquetas propuestas separadas
               por coma (prioriza: bug, enhancement, question, documentation).
               El sistema aplicará solo las que existan en el repo.

            Tu respuesta final de texto debe ser únicamente: "Triaje generado."

      - name: Aplicar triaje al issue
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.issue.number;

            const START = "<!-- opencode-triage:start -->";
            const END = "<!-- opencode-triage:end -->";

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
            const original = issue.body || "";

            let block = "";
            try { block = fs.readFileSync("/tmp/triage_block.md", "utf8").trim(); }
            catch { core.warning("Falta /tmp/triage_block.md: no se edita el cuerpo."); }

            if (block) {
              let body;
              if (original.includes(START)) {
                const re = new RegExp(START + "[\\s\\S]*?" + END, "g");
                body = original.replace(re, block);
              } else {
                body = `${original}\n\n---\n\n${block}`;
              }
              await github.rest.issues.update({ owner, repo, issue_number: number, body });
              core.info("Cuerpo actualizado con el bloque de triaje.");
            }

            let proposed = [];
            try {
              proposed = fs.readFileSync("/tmp/labels.txt", "utf8")
                .split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
            } catch { core.warning("Falta /tmp/labels.txt: no se aplican etiquetas."); }

            if (proposed.length) {
              const all = await github.paginate(
                github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
              const exact = new Map(all.map(l => [l.name.toLowerCase(), l.name]));
              const apply = proposed.map(p => exact.get(p)).filter(Boolean);
              if (apply.length) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: apply });
                core.info(`Etiquetas aplicadas: ${apply.join(", ")}`);
              } else {
                core.info("Ninguna etiqueta propuesta existía en el repo.");
              }
            }
